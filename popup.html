<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Eclipse</title><style>
*{box-sizing:border-box}body{font:14px system-ui,-apple-system,Segoe UI,sans-serif;width:385px;margin:0;background:#f7f9fc;color:#18243b}header{background:#15365c;color:white;padding:18px 20px}h1{font-size:17px;margin:0 0 4px}header small{opacity:.8}.body{padding:16px 20px}label{display:block;margin:11px 0 6px;font-weight:600}select,input{width:100%;padding:10px;border:1px solid #c7d1df;border-radius:8px;background:#fff;font:inherit;color:#18243b}.switch{display:flex;align-items:center;gap:10px;background:#e8eef7;border-radius:10px;padding:11px}.switch input{width:auto;transform:scale(1.25)}.switch label{margin:0;flex:1}.split{display:flex;gap:10px}.split>*{flex:1;min-width:0}.note{font-size:12px;color:#566477;line-height:1.5;margin:14px 0}.buttons{display:flex;gap:8px}button{border:0;border-radius:8px;background:#1767a8;color:white;padding:11px 16px;font-weight:600;cursor:pointer;flex:1}.secondary{background:#e1e7ee;color:#17385d}.diagnostics{margin-top:16px;padding:12px;background:#eef3fa;border-radius:9px;font-size:12px;line-height:1.6;white-space:normal}.diagnostics p{margin:5px 0}.good{color:#176a45}.bad{color:#a23821}.warn{color:#8b5d00}.diagnostics code{overflow-wrap:anywhere}#status{font-size:12px;color:#18764f;margin-top:10px;min-height:16px}

[hidden]{display:none!important}body{width:400px}header{display:flex;justify-content:space-between;align-items:center;background:#14152b}header select{width:125px;font-size:12px;padding:6px}details{border:1px solid #dce1eb;border-radius:10px;margin:10px 0;padding:10px}summary{cursor:pointer;font-weight:600}.list{max-height:155px;overflow:auto}.note:empty,.diagnostics:empty{display:none}button:disabled{opacity:.5;cursor:default}.state{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9298a4;margin-right:7px}#diagnostics,#ipResult{overflow-wrap:anywhere;white-space:pre-line}#quickLanguages{max-height:110px;overflow:auto}
.support{margin:12px 0;padding:12px;border:1px solid #dad3ed;border-radius:10px;background:#f0ecfa}.support strong{font-size:12px}.support-links{display:flex;gap:6px;margin-top:9px}.support-links a{flex:1;text-align:center;padding:8px 4px;border-radius:7px;background:#fff;color:#49367b;text-decoration:none;font-size:12px;font-weight:600}.support-links a:hover{background:#e3daf5}.support-links a:focus-visible{outline:2px solid #1767a8;outline-offset:2px}.project-link{font-size:12px;color:#49367b;display:inline-block;margin-top:8px}
</style></head><body>
<header><div><h1><img src="icons/icon-32.png" width="28" height="28" alt="" style="vertical-align:middle;margin-right:8px">Eclipse</h1><small>0.7.2</small></div><select id="uiLanguage" aria-label="Interface language"><option value="auto">System</option><option value="ru">Русский</option><option value="en">English</option><option value="de">Deutsch</option><option value="fi">Suomi</option><option value="it">Italiano</option></select></header><main class="body">
<aside class="support"><strong data-i18n="support"></strong><div class="support-links"><a href="https://boosty.to/diokyma" target="_blank" rel="noopener noreferrer">Boosty</a><a href="https://app.lava.top/diokyma" target="_blank" rel="noopener noreferrer">Lava.top</a><a href="https://yoomoney.ru/to/4100118568918193" target="_blank" rel="noopener noreferrer">ЮMoney</a></div><a class="project-link" href="https://github.com/boklagvladimir-dev/eclipse" target="_blank" rel="noopener noreferrer" data-i18n="source"></a></aside>
<div class="switch"><input id="enabled" type="checkbox"><label for="enabled" data-i18n="enabled"></label></div>
<label for="mode" data-i18n="mode"></label><select id="mode"><option value="simple" data-i18n="simple"></option><option value="advanced" data-i18n="advanced"></option></select>
<label for="preset" data-i18n="profile"></label><select id="preset"></select>
<label for="simpleLanguage" data-i18n="language"></label><select id="simpleLanguage"></select>
<p id="profileSummary" class="note"></p><div id="advancedSettings" hidden>
<details id="section-language"><summary data-i18n="languages"></summary><label for="languageSearch" data-i18n="languageSearch"></label><input id="languageSearch" type="search" placeholder="en-US, español, français…" autocomplete="off" aria-controls="languageResults"><div id="quickLanguages" style="display:flex;flex-wrap:wrap;gap:5px;margin:8px 0"></div><label style="font-size:12px;font-weight:400;display:flex;gap:8px;align-items:center"><input id="englishFallback" type="checkbox" checked style="width:auto"><span data-i18n="englishFallback"></span></label><div id="languageCount" class="note" role="status" style="margin:5px 0"></div><div id="languageResults" style="max-height:155px;overflow:auto;border:1px solid #c7d1df;border-radius:8px"></div><p class="note"><span data-i18n="languageHelp"></span></p><label for="locale" data-i18n="locale"></label><input id="locale" spellcheck="false">
<label for="languages" data-i18n="languageList"></label><input id="languages" spellcheck="false"><div id="languageOrder" style="margin-top:8px"></div><div id="languagePreview" class="note" role="status"></div>
</details>
<details id="section-timezone"><summary data-i18n="timezone"></summary><label for="zoneSearch" data-i18n="zoneSearch"></label><input id="zoneSearch" type="search" placeholder="IANA, Tokyo, UTC+3…" autocomplete="off" aria-controls="zoneResults"><div id="zoneCount" class="note" role="status" style="margin:5px 0"></div><div id="zoneResults" style="max-height:155px;overflow:auto;border-radius:8px;border:1px solid #c7d1df"></div><label for="timezone" data-i18n="zoneId"></label><input id="timezone" spellcheck="false"><div id="zonePreview" class="note" style="margin:5px 0"></div><p class="note"><span data-i18n="zoneHelp"></span></p>
</details>
<details id="section-geo"><summary data-i18n="geo"></summary><div class="switch" style="margin-top:14px"><input id="geoEnabled" type="checkbox"><label for="geoEnabled" data-i18n="geoEnabled"></label></div>
<div class="split"><div><label for="latitude" data-i18n="latitude"></label><input id="latitude" type="number" step="any"></div><div><label for="longitude" data-i18n="longitude"></label><input id="longitude" type="number" step="any"></div></div>
<p class="note" data-i18n="geoNote"></p></details>
<details id="section-profiles"><summary data-i18n="savedProfiles"></summary><label for="profileName" data-i18n="profileName"></label><input id="profileName" maxlength="60"><div class="buttons" style="margin-top:8px"><button id="storeProfile" data-i18n="storeProfile"></button><button id="deleteProfile" class="secondary" data-i18n="delete"></button></div></details>
<details id="section-privacy"><summary data-i18n="info"></summary><p class="note" data-i18n="notice"></p><p class="note" data-i18n="ipPrivacy"></p></details></div>
<div class="buttons"><button id="save" data-i18n="save"></button><button id="reload" class="secondary" data-i18n="reload"></button></div>
<div id="status" role="status" class="note"></div><p><span id="stateDot" class="state"></span><span id="stateText"></span></p>
<button id="diagnose" class="secondary" style="width:100%" data-i18n="check"></button>
<p class="note" data-i18n="ipPrivacy"></p><div id="ipResult" class="diagnostics" role="status"></div><div id="diagnostics" class="diagnostics" role="status"></div>
</main><script src="i18n.js"></script><script src="zones.js"></script><script src="zone-picker.js"></script><script src="languages.js"></script><script src="language-picker.js"></script><script src="regions.js"></script><script src="profiles.js"></script><script src="tab-action.js"></script><script src="popup.js"></script></body></html>
